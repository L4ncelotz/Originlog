version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "chore(deps)"

    groups:
      runtime-dependencies:
        dependency-type: "production"

      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "chore(deps)"

    groups:
      actions:
        patterns:
          - "*"
